version: '3.1'

services:

  a3mongodb:
    image: mongo
    restart: unless-stopped
    ports:
      - 27017:27017
    expose:
      - 27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: your_root_username
      MONGO_INITDB_ROOT_PASSWORD: your_root_password
    volumes:
      - ./data:/data/db
      - ./etc:/etc/mongo
